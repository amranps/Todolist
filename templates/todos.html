<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>My To-Do List</title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body>


    <div class="card">


        <div class="header">
            <p class="subtitle">STAY ORGANIZED</p>
            <h1>My To-Do List</h1>
            <p class="description">Manage your daily tasks</p>
        </div>


        <!-- Add Task -->
        <form class="add-form"
              action="{{ url_for('add_todo') }}"
              method="POST">


            <input
                type="text"
                name="task"
                placeholder="What needs doing?"
                required
                autofocus
            >


            <button type="submit" class="btn btn-primary">
                Add
            </button>


        </form>


        <!-- Task List -->
        {% if todos %}


        <ul class="todo-list">


            {% for todo in todos %}


            <li class="todo-item">


                <span class="task">
                    {{ todo.task }}
                </span>


                <div class="actions">


                    <!-- Edit -->
                    <a href="{{ url_for('edit_todo', todo_id=todo.id) }}"
                       class="btn btn-edit">
                        Edit
                    </a>


                    <!-- Delete -->
                    <form action="{{ url_for('delete_todo', todo_id=todo.id) }}"
                          method="POST"
                          onsubmit="return confirm('Are you sure you want to delete this task?')">


                        <button type="submit" class="btn btn-delete">
                            Delete
                        </button>


                    </form>


                </div>


            </li>


            {% endfor %}


        </ul>


        {% else %}


        <div class="empty">
            <p>Nothing here yet!</p>
            <span>Add your first task above.</span>
        </div>


        {% endif %}


        <footer>
            {{ todos|length }} task(s) remaining
        </footer>


    </div>


</body>
</html>
